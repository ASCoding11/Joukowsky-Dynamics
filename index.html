<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07121b">
<title>Joukowsky Dynamics</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="gate-style">
  /* Password screen in the workbench's own blueprint palette; replaced by the workbench once unlocked. */
  :root { --bg: #07121b; --surface: #0a1822; --text: #d6e8ed; --muted: #8faeb9; --accent: #6be1ed; --line: #b0e4ed24; --bad: #e0675a;
    --font-body: 'Barlow', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace; color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { display: grid; place-items: center; min-height: 100dvh; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 35%, #0f2a36 0%, var(--bg) 65%), var(--bg);
    background-image: linear-gradient(#6be1ed0a 1px, transparent 1px), linear-gradient(90deg, #6be1ed0a 1px, transparent 1px), radial-gradient(ellipse at 50% 35%, #0f2a36 0%, var(--bg) 65%);
    background-size: 32px 32px, 32px 32px, auto; }
  .gate { width: min(440px, 100%); border: 1px solid var(--line); background: #08151ee6; padding: 28px; display: flex; flex-direction: column; gap: 16px; position: relative; }
  .gate::before, .gate::after { content: ''; position: absolute; width: 22px; height: 22px; border: 1px solid var(--accent); opacity: .6; }
  .gate::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .gate::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .mark { font: 600 22px/1 var(--font-body); letter-spacing: 3px; }
  .mark span { display: block; color: var(--accent); font-weight: 400; font-size: 13px; letter-spacing: 5px; margin-top: 6px; }
  .eyebrow { font: 11px var(--font-mono); letter-spacing: 1.5px; color: var(--accent); margin: 0; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; line-height: 1.3; text-wrap: balance; }
  p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 15px; }
  label { font: 11px var(--font-mono); letter-spacing: 1.5px; color: var(--muted); }
  input { font: 17px var(--font-mono); color: var(--text); background: #091923; border: 1px solid var(--line); padding: 12px 14px; min-height: 46px; width: 100%; box-sizing: border-box; letter-spacing: 2px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button { font: 500 14px var(--font-mono); letter-spacing: 1px; color: var(--bg); background: var(--accent); border: 0; min-height: 46px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .msg { min-height: 1.4em; font: 13px var(--font-mono); color: var(--muted); }
  .msg.bad { color: var(--bad); }
  @media (prefers-reduced-motion: no-preference) { .gate { animation: rise .5s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(8px); } } }
</style>
</head>
<body>
<form class="gate" id="gate" autocomplete="off">
  <div class="mark">JOUKOWSKY<span>DYNAMICS</span></div>
  <p class="eyebrow">REV 08 · RESTRICTED ENGINEERING WORKBENCH</p>
  <h1>Enter the password to open the workbench</h1>
  <p>The holographic sequence, the CAD blueprint and the flight analysis are encrypted until the password is entered.</p>
  <label for="pw">PASSWORD</label>
  <input id="pw" type="password" autocomplete="current-password" spellcheck="false" required autofocus>
  <button type="submit">UNLOCK</button>
  <div class="msg" id="msg" aria-live="polite"></div>
</form>
<script>
// The workbench is stored encrypted in vault.bin (AES-256-GCM, key from the password via PBKDF2; built by tools/build_vault.py).
// The right password decrypts it here and it loads in place on this page; a wrong one never gets readable content.
(function () {
  var KEY = 'jd-key', ITER = 310000;
  var form = document.getElementById('gate'), pw = document.getElementById('pw'), msg = document.getElementById('msg');
  var vault = null;
  function getVault() {
    if (!vault) vault = fetch('vault.bin', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('vault ' + r.status); return r.arrayBuffer(); });
    return vault;
  }
  async function keyFrom(password, salt) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(buf, key) {
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 16, 12) }, key, new Uint8Array(buf, 28));
    var hl = new DataView(plain).getUint32(0, true);
    var head = JSON.parse(new TextDecoder().decode(new Uint8Array(plain, 4, hl))), files = {};
    for (var n in head) files[n] = plain.slice(4 + hl + head[n][0], 4 + hl + head[n][0] + head[n][1]);
    return files;
  }
  function mount(files) {
    var td = new TextDecoder(), text = function (n) { return td.decode(files[n]); };
    window.__JD_DATA = { parts: JSON.parse(text('advanced/data/parts.json')), meshes: files['advanced/data/meshes.bin'] };
    var doc = new DOMParser().parseFromString(text('index.html'), 'text/html');
    document.getElementById('gate-style').remove();
    document.title = doc.title;
    ['base.css', 'style.css', 'revision.css', 'design.css', 'advanced/advanced.css'].forEach(function (n) {
      var st = document.createElement('style'); st.textContent = text(n); document.head.appendChild(st);
    });
    var map = doc.querySelector('script[type="importmap"]');
    doc.querySelectorAll('script').forEach(function (sc) { sc.remove(); });
    document.body.removeAttribute('style'); document.body.innerHTML = doc.body.innerHTML;
    if (map) { var im = document.createElement('script'); im.type = 'importmap'; im.textContent = map.textContent; document.head.appendChild(im); }
    ['app.js', 'advanced/advanced.js'].forEach(function (n) {
      var sc = document.createElement('script'); sc.type = 'module'; sc.async = false;
      sc.src = URL.createObjectURL(new Blob([files[n]], { type: 'text/javascript' }));
      document.body.appendChild(sc);
    });
  }
  // already unlocked in this browser tab: skip the prompt
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    msg.textContent = 'OPENING…';
    Promise.all([getVault(), crypto.subtle.importKey('raw', Uint8Array.from(atob(saved), function (c) { return c.charCodeAt(0); }), 'AES-GCM', false, ['decrypt'])])
      .then(function (r) { return open(r[0], r[1]); }).then(mount)
      .catch(function () { msg.textContent = ''; try { sessionStorage.removeItem(KEY); } catch (e) {} });
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!pw.value.trim()) return;
    msg.className = 'msg'; msg.textContent = 'CHECKING…';
    try {
      var buf = await getVault();
      var key = await keyFrom(pw.value, new Uint8Array(buf, 0, 16));
      var files = await open(buf, key);
      try { sessionStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch (e) {}
      msg.textContent = 'OPENING…';
      mount(files);
    } catch (err) {
      msg.className = 'msg bad';
      msg.textContent = /vault/.test(err && err.message) ? 'The workbench could not be loaded. Check your connection and try again.' : 'That password isn’t right. Try again.';
      pw.select();
    }
  });
})();
</script>
</body>
</html>
